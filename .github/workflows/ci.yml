# Continuous integration: build, vet, format-check and test on every push and PR.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.1
          terraform_wrapper: false
      - name: Metadata, HCL, entrypoint, and release-note contracts
        run: go test . ./internal/contract ./internal/cmd/release-notes -count=1
      - name: Validate release manifest notes
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          go run ./internal/cmd/release-notes \
            -tag "v${version}" \
            -changelog CHANGELOG.md \
            -output "$RUNNER_TEMP/release-notes.md"
      - name: Upgrade harness regression tests
        run: python3 -m unittest discover -s internal_testing/upgrade_matrix/tests -p 'test_*.py'
      - name: Offline LiteLLM API contract check
        run: make contract-check
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
      - name: Check published HCL formatting
        run: terraform fmt -check -recursive examples internal_testing
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test
        run: |
          set -o pipefail
          gotestsum --junitfile junit.xml --format testname -- \
            -timeout=20m -race -covermode=atomic -coverprofile=coverage.out ./... 2>&1 | tee gotestsum.log
      - name: GoReleaser v2 configuration check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - name: Nonpublishing release snapshot for all configured targets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          total="unavailable"
          if [ -s coverage.out ]; then
            # HTML artifact and plain-text per-function breakdown.
            go tool cover -html=coverage.out -o coverage.html
            go tool cover -func=coverage.out > coverage.txt
            total="$(awk '/^total:/ {print $NF}' coverage.txt)"
          else
            echo '::notice::coverage.out was not produced; see the first failing step.'
          fi
          echo "coverage_total=$total" >> "$GITHUB_OUTPUT"
        id: coverage
      - name: Test summary
        if: ${{ !cancelled() }}
        env:
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.coverage_total }}
        run: |
          {
            echo '## Test results'
            echo ''
            echo '```'
            # Strip ANSI color escapes so the summary renders as plain text.
            if [ -f gotestsum.log ]; then
              sed -E 's/\x1b\[[0-9;]*m//g' gotestsum.log
            else
              echo 'Tests did not start; see the first failing step.'
            fi
            echo '```'
            echo ''
            echo "## Coverage: ${COVERAGE_TOTAL}"
            if [ -f coverage.txt ]; then
              echo ''
              echo '<details><summary>Per-function coverage</summary>'
              echo ''
              echo '```'
              cat coverage.txt
              echo '```'
              echo ''
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage.txt
          if-no-files-found: warn
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn
