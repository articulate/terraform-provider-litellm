name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'articulate/terraform-provider-litellm' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_SMALL }}
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Create release automation token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: terraform-provider-litellm
          permission-contents: write
          permission-pull-requests: write
      - name: Maintain release pull request and draft release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
