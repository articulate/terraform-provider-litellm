name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'articulate/terraform-provider-litellm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Maintain release pull request and draft release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
      # GITHUB_TOKEN events do not start downstream workflows automatically.
      - name: Check the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
      - name: Publish the new release tag
        if: always() && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
