# Terraform Provider release workflow.
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: litellm-provider-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-cli-gate:
    name: Exact-tag full matrix (${{ matrix.product }} ${{ matrix.version }})
    if: github.repository == 'articulate/terraform-provider-litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: terraform
            version: 1.1.0
            executable: terraform
          - product: terraform
            version: 1.11.4
            executable: terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag is on the actual default-branch history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - name: Download Go modules for the offline contract check
        # contract-check type-checks the provider with GOPROXY=off, so every
        # module must already be in the module cache; a cold setup-go cache
        # (for example after seven days without a main-branch run) is empty.
        run: go mod download
      - name: Verify checked LiteLLM API contract
        run: make contract-check
      - name: Install exact CLI and build exact-tag provider
        run: |
          python3 internal_testing/upgrade_matrix/harness.py install-tool \
            "${{ matrix.product }}" "${{ matrix.version }}" --cache "$RUNNER_TEMP/tools"
          install -d -m 700 "$RUNNER_TEMP/provider" "$RUNNER_TEMP/report"
          go build -o "$RUNNER_TEMP/provider/terraform-provider-litellm" .
      - name: Start exact disposable LiteLLM backend
        timeout-minutes: 5
        run: |
          internal_testing/compose.sh up -d
          for _ in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 3 --max-time 10 \
              http://localhost:4000/health/liveliness >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute full exact-tag lane
        env:
          TF_ACC: '1'
          LITELLM_ACCEPTANCE_CONFIRM: local-v1.104.0
          MATRIX_CLI: ${{ runner.temp }}/tools/${{ matrix.product }}/${{ matrix.version }}/linux_amd64/${{ matrix.executable }}
          MATRIX_PROVIDER_BINARY: ${{ runner.temp }}/provider/terraform-provider-litellm
          MATRIX_CACHE: ${{ runner.temp }}/matrix-cache
          MATRIX_REPORT: ${{ runner.temp }}/report/result.json
        run: sh internal_testing/upgrade_matrix/run.sh local
      - name: Verify report is bound to the exact tagged SHA and lane
        env:
          EXPECTED_LANE: ${{ matrix.product }}-${{ matrix.version }}
        run: |
          python3 - "$RUNNER_TEMP/report/result.json" "$GITHUB_SHA" "$EXPECTED_LANE" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          provenance=value['provenance']
          actual=f"{provenance['cli_product']}-{provenance['cli_version']}"
          if provenance['candidate_commit'] != sys.argv[2] or actual != sys.argv[3]:
              raise SystemExit('release evidence is not bound to the exact tag/lane')
          PY
      - name: Destroy isolated backend fallback
        if: always()
        timeout-minutes: 10
        run: internal_testing/compose.sh down -v
      - name: Preserve redacted report and safe evidence ledger
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ matrix.product }}-${{ matrix.version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/report/result.json
            ${{ runner.temp }}/report/result.evidence.jsonl
          if-no-files-found: error

  goreleaser:
    name: Publish exact gated tag
    if: github.repository == 'articulate/terraform-provider-litellm'
    needs: full-cli-gate
    environment: provider-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules for the offline contract check
        # contract-check type-checks the provider with GOPROXY=off, so every
        # module must already be in the module cache; a cold setup-go cache
        # (for example after seven days without a main-branch run) is empty.
        run: go mod download
      - name: Verify checked LiteLLM API contract
        run: make contract-check
      - name: Generate exact-tag release notes
        run: |
          go run ./internal/cmd/release-notes \
            -tag "${GITHUB_REF_NAME}" \
            -changelog CHANGELOG.md \
            -output "${RUNNER_TEMP}/release-notes.md"
      - name: Require the dedicated signing fingerprint
        env:
          EXPECTED_FINGERPRINT: ${{ vars.PROVIDER_GPG_FINGERPRINT }}
        run: |
          if [[ ! "$EXPECTED_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]; then
            echo 'Set PROVIDER_GPG_FINGERPRINT to the full uppercase fingerprint.' >&2
            exit 1
          fi
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Verify the dedicated signing key
        env:
          EXPECTED_FINGERPRINT: ${{ vars.PROVIDER_GPG_FINGERPRINT }}
          IMPORTED_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          actual="$(printf '%s' "$IMPORTED_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$EXPECTED_FINGERPRINT" ]; then
            echo 'Imported key does not match the dedicated release fingerprint.' >&2
            exit 1
          fi
      - name: Build and sign only after both Terraform lanes
        uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Stage and check the registry upload
        run: |
          version=${GITHUB_REF_NAME#v}
          cp terraform-registry-manifest.json "dist/terraform-provider-litellm_${version}_manifest.json"
          cd dist
          sha256sum --check "terraform-provider-litellm_${version}_SHA256SUMS"
      - name: Install checksum-pinned boring-registry
        run: |
          archive="$RUNNER_TEMP/boring-registry.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            https://github.com/boring-registry/boring-registry/releases/download/v0.16.6/boring-registry_0.16.6_Linux_x86_64.tar.gz \
            --output "$archive"
          echo "9d0b17771ace559de21440d2e25e9dd66d3818f476cf94212413fbb79e6b11e9  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" boring-registry
      - name: Authenticate for the LiteLLM registry prefix
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::233118049495:role/github-actions
          allowed-account-ids: '233118049495'
          role-session-name: litellm-release-${{ github.run_id }}
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "s3:ListBucket",
                  "Resource": "arn:aws:s3:::tf-registry-us-east-1-233118049495"
                },
                {
                  "Effect": "Allow",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::tf-registry-us-east-1-233118049495/providers/articulate/signing-keys.json"
                },
                {
                  "Effect": "Allow",
                  "Action": ["s3:GetObject", "s3:PutObject", "s3:AbortMultipartUpload"],
                  "Resource": "arn:aws:s3:::tf-registry-us-east-1-233118049495/providers/articulate/litellm/*"
                }
              ]
            }
      - name: Upload the signed provider to the registry
        run: |
          "$RUNNER_TEMP/boring-registry" upload provider \
            --storage-s3-bucket tf-registry-us-east-1-233118049495 \
            --storage-s3-region us-east-1 \
            --namespace articulate \
            --filename-sha256sums "$GITHUB_WORKSPACE/dist/terraform-provider-litellm_${GITHUB_REF_NAME#v}_SHA256SUMS"
      - name: Publish the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
