name: Reproduce LiteLLM API contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: provider
      - name: Check out exact LiteLLM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BerriAI/litellm
          ref: d8f71d7bdbd7c9873d98293f83d64c6db72847e6
          path: litellm
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install and verify pinned uv
        run: |
          python -m pip install uv==0.12.6
          test "$(uv --version | awk '{print $1 " " $2}')" = "uv 0.12.6"
      - name: Regenerate twice with distinct hash seeds and compare checked artifacts
        working-directory: provider
        env:
          LITELLM_SOURCE: ../litellm
          UV: uv
        run: make contract-diff
      - name: Download Go modules for the offline verifier
        working-directory: provider
        run: go mod download
      - name: Run offline verifier
        working-directory: provider
        run: make contract-check
